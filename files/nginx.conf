worker_processes  auto;
#worker_rlimit_nofile 100000;
events {
     worker_connections 2048;
     multi_accept on;
}

error_log  /var/log/nginx/error.log notice;                                                
pid        /tmp/nginx.pid;

http {
    include       mime.types;
    default_type  application/octet-stream;
    log_format speedtest_result escape=json
      '{"time":"$time_iso8601","client_ip":"$remote_addr","xff":"$http_x_forwarded_for","method":"$request_method","download_mbps":"$arg_d","upload_mbps":"$arg_u","ping_ms":"$arg_p","browser_rtt_ms":"$arg_brtt","jitter_ms":"$arg_j","download_mb":"$arg_dd","upload_mb":"$arg_ud","os":"$arg_os","platform":"$arg_platform","user_agent":"$arg_ua","http_user_agent":"$http_user_agent","request_id":"$request_id"}';
    include /etc/nginx/conf.d/*.conf;
 
      
 }
 
 
