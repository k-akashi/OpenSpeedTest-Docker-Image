worker_processes  auto;
#worker_rlimit_nofile 100000;
events {
     worker_connections 2048;
     multi_accept on;
}

error_log  /var/log/nginx/error.log notice;                                                
pid        /tmp/nginx.pid;

http {
    include       mime.types;
    default_type  application/octet-stream;
    map "$arg_speedtest_result:$arg_speedtest_debug" $log_speedtest_basic {
      default 0;
      "1:" 1;
      "1:0" 1;
    }
    map "$arg_speedtest_result:$arg_speedtest_debug" $log_speedtest_debug {
      default 0;
      "1:1" 1;
    }
    log_format speedtest_result escape=json
      '{"time":"$time_iso8601","download_mbps":"$arg_d","upload_mbps":"$arg_u","ping_ms":"$arg_p","browser_rtt_ms":"$arg_brtt","jitter_ms":"$arg_j","download_mb":"$arg_dd","upload_mb":"$arg_ud"}';
    log_format speedtest_debug escape=json
      '{"time":"$time_iso8601","client_ip":"$remote_addr","xff":"$http_x_forwarded_for","method":"$request_method","download_mbps":"$arg_d","upload_mbps":"$arg_u","ping_ms":"$arg_p","browser_rtt_ms":"$arg_brtt","jitter_ms":"$arg_j","download_mb":"$arg_dd","upload_mb":"$arg_ud","os":"$arg_os","platform":"$arg_platform","user_agent":"$arg_ua","http_user_agent":"$http_user_agent","request_id":"$request_id"}';
    access_log /dev/stdout speedtest_result if=$log_speedtest_basic;
    access_log /dev/stdout speedtest_debug if=$log_speedtest_debug;
    access_log /var/log/nginx/speedtest-result.log speedtest_result if=$log_speedtest_basic;
    access_log /var/log/nginx/speedtest-result.log speedtest_debug if=$log_speedtest_debug;
    include /etc/nginx/conf.d/*.conf;
 
      
 }
 
 
